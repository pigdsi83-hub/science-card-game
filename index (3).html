const board=document.getElementById('board'),found=document.getElementById('found'),tries=document.getElementById('tries'),clock=document.getElementById('clock'),message=document.getElementById('message'),win=document.getElementById('win');
let first=null,second=null,locked=false,matches=0,attempts=0,started=null,timer=null,round=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tick(){if(!started)return;let t=Math.floor((Date.now()-started)/1000);clock.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function newGame(){round++;clearInterval(timer);timer=null;started=null;first=second=null;locked=false;matches=attempts=0;found.textContent='0 / 12';tries.textContent='0';clock.textContent='00:00';message.textContent='카드 두 장을 선택하세요!';win.classList.remove('show');board.replaceChildren();const deck=shuffle(PAIRS.flatMap(p=>[{id:p.id,type:'image',img:p.img,label:p.label},{id:p.id,type:'term',label:p.label}]));for(const card of deck){let el=document.createElement('button');el.className='card';el.type='button';el.setAttribute('aria-label','뒤집지 않은 카드');el.innerHTML='<span class="inner"><span class="face back"><b>?</b><small>SCIENCE</small></span><span class="face front '+(card.type==='term'?'term':'')+'"></span></span>';let face=el.querySelector('.front');if(card.type==='image'){let img=document.createElement('img');img.src=card.img;img.alt='과학 교과서 그림';face.append(img)}else{face.textContent=card.label}el.addEventListener('click',()=>flip(el,card));board.append(el);}}
function flip(el,card){if(locked||el.classList.contains('open')||el.classList.contains('matched'))return;if(!started){started=Date.now();timer=setInterval(tick,500)}el.classList.add('open');el.setAttribute('aria-label',card.type==='term'?'용어: '+card.label:'과학 그림 카드');if(!first){first={el,card};return}second={el,card};attempts++;tries.textContent=attempts;locked=true;const currentRound=round;if(first.card.id===second.card.id&&first.card.type!==second.card.type){message.textContent='정답! '+card.label+' 🎯';setTimeout(()=>{if(currentRound!==round)return;first.el.classList.add('matched');second.el.classList.add('matched');first.el.disabled=second.el.disabled=true;first=second=null;locked=false;matches++;found.textContent=matches+' / 12';if(matches===12){clearInterval(timer);tick();message.textContent='축하합니다! 모든 카드를 맞혔어요!';document.getElementById('summary').textContent='총 '+attempts+'번 시도 · '+clock.textContent+' 소요';win.classList.add('show')}},430)}else{message.textContent='다른 짝이에요. 다시 기억해 보세요!';setTimeout(()=>{if(currentRound!==round)return;first.el.classList.remove('open');second.el.classList.remove('open');first.el.setAttribute('aria-label','뒤집지 않은 카드');second.el.setAttribute('aria-label','뒤집지 않은 카드');first=second=null;locked=false;},1050)}}
document.getElementById('reset').onclick=newGame;document.getElementById('again').onclick=newGame;newGame();
</script></body></html>
